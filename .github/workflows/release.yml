name: Release APK

# Push a tag such as v1.0.0 to build a signed APK and publish it as a GitHub Release.
# Stable download link (always the newest release):
#   https://github.com/<owner>/<repo>/releases/latest/download/CallGuard.apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See README (Publishing)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk CallGuard.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('שומר שיחות {0}', github.ref_name) || format('Build {0}', github.run_number) }}
          make_latest: true
          files: CallGuard.apk
          body: |
            ### הורדה
            **[⬇️ הורדת שומר שיחות (APK)](https://github.com/${{ github.repository }}/releases/latest/download/CallGuard.apk)**

            1. פותחים את הקובץ בטלפון.
            2. מאשרים "התקנה מאפליקציות לא ידועות" אם Android מבקש.
            3. אם Play Protect מזהיר, בוחרים "פרטים נוספים" ← "התקנה בכל זאת".

            דורש Android 10 ומעלה.
